name: Hand-crank fan variants

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fan-variant:
    name: fan-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [flat-three, steep-three]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check hand-crank fan variant
        run: python3 scripts/ci/run_tests.py fan ${{ matrix.variant }}
