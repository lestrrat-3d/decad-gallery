  records-validation:
    needs: [plan, repository, case-workers, package-workers, renderer-full, escapement, onewayclutch, clamparm, sevensegment, turbinefan, wheel, siren, bevel-full, planetary-full, bevel-remainder, handcrankfan-full, swisslever-full]
    if: always() && needs.plan.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    runs-on: ubuntu-latest
    env:
      CASE_PLAN: ${{ needs.plan.outputs.case_plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Discover full test inventory
        run: python3 scripts/ci/inventory.py > inventory.json
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-records-*
          path: ci-artifacts
      - name: Validate full execution records
        run: python3 scripts/ci/reconcile_records.py --execution-dir ci-artifacts --inventory inventory.json --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" > validation-summary.json
      - name: Report test timings
        run: python3 scripts/ci/report_timings.py --execution-dir ci-artifacts > timing-summary.json
      - name: Retain inventory and validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-summary
          path: |
            inventory.json
            validation-summary.json
            timing-summary.json
          if-no-files-found: warn
          overwrite: true
      - name: Check producer results
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os, sys; results = json.loads(os.environ["NEEDS_JSON"]); failed = [name for name, job in results.items() if job["result"] != "success" and not (name == "case-workers" and os.environ["CASE_PLAN"] == "null" and job["result"] == "skipped")]; print("Unsuccessful producers:", ", ".join(failed)); sys.exit(bool(failed))'

  model-checks:
    if: always()
    needs: [plan, worker, repository, case-workers, package-workers, renderer-full, planetary-motion, wheel-motion, wheel-parts, fan-motion, escapement,
            onewayclutch, clamparm, sevensegment, sevensegment-render, turbinefan, escapement-exploded, wheel, siren, bevel-pr, bevel-full,
            records-validation, planetary-full, bevel-remainder, handcrankfan-full, swisslever-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check planned results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/gate.py
