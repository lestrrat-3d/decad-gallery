name: Repository structure

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository layout
        run: python3 scripts/check_repository.py
      - name: Check spur generation record
        run: python3 scripts/modelgen/spurgear.py check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check model regressions
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python3 scripts/ci/run_tests.py models pr
      - name: Check full model suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/ci/run_tests.py models full

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check fast model rendering
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: go -C tools/render test -skip '^Test(BevelGearHero|BevelGearStraightHigh|GalleryHero|SpinningWheel.*)$' -timeout 5m ./...
      - name: Check spinning wheel rendering
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: go -C tools/render test -run '^TestSpinningWheel' -timeout 5m ./...
      - name: Check all model rendering
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: go -C tools/render test -timeout 60m ./...

  bevel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
          - shard: b
          - shard: c
          - shard: d
          - shard: e
          - shard: f
          - shard: g
          - shard: h
    name: bevel-${{ matrix.shard }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check representative bevel geometry
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python3 scripts/ci/run_tests.py bevel pr ${{ matrix.shard }}
      - name: Check full bevel coverage shard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/ci/run_tests.py bevel full ${{ matrix.shard }}
