name: Repository structure

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: repository-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      case_plan: ${{ steps.case-plan.outputs.plan }}
      case_matrix: ${{ steps.case-plan.outputs.matrix }}
      package_matrix: ${{ steps.package-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      # Compile every package and test binary once so setup-go saves the build cache before any
      # matrix job starts. A go.sum change (a decad bump) leaves no cache for the new key, and
      # parallel jobs would each compile cold. Failures here surface in the jobs that run the tests.
      - name: Warm Go build cache
        continue-on-error: true
        run: go test -run '^$' -vet=off -count=1 ./...
      - id: plan
        env:
          CI_BROAD_OVERRIDE: ${{ vars.CI_BROAD_OVERRIDE }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: python3 scripts/ci/plan.py
      - id: matrix
        env:
          PLAN_JSON: ${{ steps.plan.outputs.plan }}
        run: python3 scripts/ci/gate.py matrix
      - id: case-plan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(steps.plan.outputs.plan).suites, 'full')
        run: python3 scripts/ci/case_inventory.py plan
      - id: package-matrix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(steps.plan.outputs.plan).suites, 'full')
        env:
          CASE_PLAN: ${{ steps.case-plan.outputs.plan }}
        run: python3 scripts/ci/full_partition.py package-matrix

  worker:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: worker-${{ matrix.suite }}-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'renderer-all' && 180 || 75 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Run selected suite
        env:
          SUITE: ${{ matrix.suite }}
          CASE: ${{ matrix.case }}
        run: python3 scripts/ci/gate.py run

  repository:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check repository layout
        run: python3 scripts/check_repository.py
      - name: Check clamp arm capacity documentation
        if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.plan).changed_paths, 'models/clamparm/instructions.md')
        run: go test ./internal/clamparmcapacity
      - name: Check dependency updater rollback
        run: python3 -m unittest discover -s scripts -p 'test_update_decad.py'
      - name: Check render comparison script
        run: python3 -m unittest discover -s scripts -p 'test_render_compare.py'
      - name: Check CI test runner
        run: python3 -m unittest discover -s scripts/ci -p 'test_run_tests.py'
      - name: Check CI planner and gate
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check isolated test files
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: python3 scripts/ci/check_isolated_tests.py
      - name: Check spur generation record
        run: python3 scripts/modelgen/spurgear.py check
      - name: Check workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Check mesh geometry helpers
        if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full')
        run: go test ./internal/meshgap ./internal/gearroot ./internal/edgefinish ./internal/m2fastener ./internal/cornercheck ./internal/splitcheck -timeout 5m
      - name: Check model regressions
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full')
        run: python3 scripts/ci/run_tests.py models pr
  package-workers:
    needs: plan
    if: needs.plan.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run package shard
        env:
          CASE_PLAN: ${{ needs.plan.outputs.case_plan }}
          CI_TEST_RECORDS: package-workers-${{ matrix.case }}.jsonl
          CI_TEST_CASE: ${{ matrix.case }}
        run: python3 scripts/ci/full_partition.py package-shard '${{ matrix.case }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-records-package-workers-${{ matrix.case }}
          path: package-workers-${{ matrix.case }}.jsonl
          if-no-files-found: error
          overwrite: true

  case-workers:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.case_plan != '' && needs.plan.outputs.case_plan != 'null'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.case_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Run planned cycloidal checks
        env:
          CASE_PLAN: ${{ needs.plan.outputs.case_plan }}
          CI_TEST_CASE: ${{ matrix.case }}
          CI_TEST_RECORDS: execution.jsonl
          CI_CASE_RECEIPT: receipt.json
        run: python3 scripts/ci/case_inventory.py run
      - uses: actions/upload-artifact@v4
        with:
          name: ci-records-case-workers-${{ matrix.case }}
          path: |
            receipt.json
            execution.jsonl
          if-no-files-found: error
          overwrite: true

  renderer-full:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check full renderer suite
        env:
          CI_TEST_RECORDS: renderer-full-${{ matrix.shard }}.jsonl
          CI_TEST_CASE: ${{ matrix.shard }}
        run: python3 scripts/ci/gate.py renderer-full ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-records-renderer-full-${{ matrix.shard }}
          path: renderer-full-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          overwrite: true

  planetary-motion:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check planetary gearbox motion
        run: go test -run '^TestPlanetaryGearboxMotion$' -timeout 10m ./tools/render

  wheel-motion:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check spinning wheel motion
        run: go test -run '^TestSpinningWheelMotion$' -timeout 30m ./tools/render

  wheel-parts:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check spinning wheel parts table
        run: go test -run '^TestSpinningWheelPartsTable$' -timeout 40m ./tools/render

  fan-motion:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check hand-crank fan motion
        run: go test -run '^TestHandCrankFanMotion$' -timeout 20m ./tools/render

  escapement:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check Graham escapement
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && 'escapement.jsonl' || '' }}
        run: python3 scripts/ci/run_tests.py escapement all
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-escapement
          path: escapement.jsonl
          if-no-files-found: error
          overwrite: true

  onewayclutch:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check one-way clutch
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && 'onewayclutch.jsonl' || '' }}
        run: python3 scripts/ci/run_tests.py onewayclutch all
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-onewayclutch
          path: onewayclutch.jsonl
          if-no-files-found: error
          overwrite: true

  clamparm:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check clamp arm
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && 'clamparm.jsonl' || '' }}
        run: python3 scripts/ci/run_tests.py clamparm all
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-clamparm
          path: clamparm.jsonl
          if-no-files-found: error
          overwrite: true

  sevensegment:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - parts
          - assembly
          - placement-x
          - placement-offset
          - placement-quarter
    name: sevensegment-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check seven-segment display shard
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && format('sevensegment-{0}.jsonl', matrix.shard) || '' }}
          CI_TEST_CASE: ${{ matrix.shard }}
        run: python3 scripts/ci/run_tests.py sevensegment ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-sevensegment-${{ matrix.shard }}
          path: sevensegment-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          overwrite: true

  sevensegment-render:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check seven-segment renderer
        run: python3 scripts/ci/run_tests.py sevensegment render

  turbinefan:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check turbine fan
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && 'turbinefan.jsonl' || '' }}
        run: python3 scripts/ci/run_tests.py turbinefan all
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-turbinefan
          path: turbinefan.jsonl
          if-no-files-found: error
          overwrite: true

  escapement-exploded:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check escapement exploded view
        run: go test -run '^TestEscapementExploded$' -timeout 15m ./tools/render

  wheel:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    strategy:
      fail-fast: false
      matrix:
        case:
          - default-verify
          - default-linkage
          - native
          - small-seven-verify
          - small-seven-linkage
          - large-nine-verify
          - large-nine-linkage
          - twelve
          - small-seventeen
          - rest
    name: wheel-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check spinning wheel
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && format('wheel-{0}.jsonl', matrix.case) || '' }}
          CI_TEST_CASE: ${{ matrix.case }}
        run: python3 scripts/ci/run_tests.py wheel ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-wheel-${{ matrix.case }}
          path: wheel-${{ matrix.case }}.jsonl
          if-no-files-found: error
          overwrite: true

  siren:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    strategy:
      fail-fast: false
      matrix:
        case:
          - default
          - spike
          - slots12
          - slots24
          - rest
    name: siren-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check hand-crank siren
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && format('siren-{0}.jsonl', matrix.case) || '' }}
          CI_TEST_CASE: ${{ matrix.case }}
        run: python3 scripts/ci/run_tests.py siren ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-siren-${{ matrix.case }}
          path: siren-${{ matrix.case }}.jsonl
          if-no-files-found: error
          overwrite: true

  bevel-pr:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full')
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: abgh
          - group: cdef
          - group: rest-0
          - group: rest-1
          - group: rest-2
          - group: rest-3
    name: bevel-${{ matrix.group }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check representative bevel geometry shards
        run: python3 scripts/ci/run_tests.py bevel pr ${{ matrix.group }}

  bevel-full:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
          - shard: b
          - shard: c
          - shard: d
          - shard: e
          - shard: f
          - shard: g
          - shard: h
    name: bevel-${{ matrix.shard }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - name: Check full bevel coverage shard
        env:
          CI_TEST_RECORDS: bevel-full-${{ matrix.shard }}.jsonl
          CI_TEST_CASE: ${{ matrix.shard }}
        run: python3 scripts/ci/run_tests.py bevel full ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-records-bevel-full-${{ matrix.shard }}
          path: bevel-full-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          overwrite: true

  planetary-full:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    strategy:
      fail-fast: false
      matrix:
        case: [planet605-shaft608, planet608-shaft605, planet608-shaft608, rest-0, rest-1, rest-2, rest-3, rest-4]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
