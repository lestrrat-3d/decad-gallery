name: Repository structure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      curved_union_gate:
        description: Run one bounded source-default curved bevel public Union gate
        type: choice
        required: true
        default: none
        options: [none, serial, variadic]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository layout
        run: python3 scripts/check_repository.py
      - name: Check spur generation record
        run: python3 scripts/modelgen/spurgear.py check
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check model geometry
        run: |
          bevel_skip='^Test(RealEightToothFullPatternJoin|JoinedEightToothPairThroughBore|SourceDefaultSpiral(FirstToothJoin|FullCombine|Pair|SerialPublicUnion|VariadicPublicUnion)|SourceFourFourStraight(Member|Pair)(AutoBore)?|SourceSixteenTwelveStraightPair(AutoBore)?)$'
          helical_skip='^Test(SmallHelicalToothAndRootDiscVerifyIndividually|SmallRealHelicalGear(ThroughBore|WithCapChamfer|WithBoreAndCapChamfer)?|DefaultRealHelicalGear(ThroughBore|WithBoreAndCapChamfer)?)$'
          herringbone_skip='^Test(Small|Default)RealHerringboneGearWithBoreAndCapChamfer$'
          spur_skip='^TestPlacedEmbeddedGearWithRootFilletsAndBore$'
          go test -skip "$bevel_skip|$helical_skip|$herringbone_skip|$spur_skip" ./...
  spur-placement:
    name: spur-placement (TestPlacedEmbeddedGearWithRootFilletsAndBore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check placed embedded spur gear
        run: go test ./models/spurgear -run '^TestPlacedEmbeddedGearWithRootFilletsAndBore$' -timeout 20m
  bevel-assembly:
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestRealEightToothFullPatternJoin
            timeout: 5m
          - test: TestJoinedEightToothPairThroughBore
            timeout: 10m
          - test: TestSourceDefaultSpiralFirstToothJoin/driving
            timeout: 5m
          - test: TestSourceDefaultSpiralFirstToothJoin/pinion
            timeout: 5m
          - test: TestSourceDefaultSpiralFullCombine/driving
            timeout: 10m
          - test: TestSourceDefaultSpiralFullCombine/pinion
            timeout: 10m
          - test: TestSourceFourFourStraightMember
            timeout: 5m
          - test: TestSourceFourFourStraightMemberAutoBore
            timeout: 5m
    name: bevel-assembly (${{ matrix.test }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check real bevel assembly
        run: go test ./models/bevelgear -run '^${{ matrix.test }}$' -timeout ${{ matrix.timeout }}
  bevel-curved-public-union-gate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.curved_union_gate == 'serial' || inputs.curved_union_gate == 'variadic')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: golang:1.26.8-bookworm
      options: --memory=4g --memory-swap=4g
    env:
      DECAD_SHA: 1b610b5b79616de42c7a3df7a974b034a5860762
      GATE_TEST: >-
        ${{ inputs.curved_union_gate == 'serial' &&
        'TestSourceDefaultSpiralSerialPublicUnion' ||
        'TestSourceDefaultSpiralVariadicPublicUnion' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check generic Decad candidate and curved Union
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296
          test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
          report_memory() {
            printf 'cgroup peak bytes: '
            cat /sys/fs/cgroup/memory.peak
            printf 'cgroup memory events:\n'
            cat /sys/fs/cgroup/memory.events
          }
          trap report_memory EXIT
          [[ "$DECAD_SHA" =~ ^[[:xdigit:]]{40}$ ]]
          pinned=$(go list -m -f '{{.Version}}' github.com/lestrrat-3d/decad)
          candidate=$(go list -m -f '{{.Version}}' "github.com/lestrrat-3d/decad@$DECAD_SHA")
          test "$pinned" = "$candidate"
          decad_dir=$(go list -m -f '{{.Dir}}' github.com/lestrrat-3d/decad)
          test -f "$decad_dir/boolean.go"
          test -f "$decad_dir/boolean_many.go"
          if grep -Eq 'tryBevel(OneTooth|TwoTooth|Pattern)Union|spiralPrepare(First|Combined)Union|spiralCombineBody' \
            "$decad_dir/boolean.go" "$decad_dir/boolean_many.go"; then
            printf 'legacy bevel Union dispatch remains in Decad candidate\n' >&2
            exit 1
          fi
          printf 'Decad generic candidate: %s (%s)\n' "$DECAD_SHA" "$pinned"
          printf 'Curved Union gate: %s\n' "$GATE_TEST"
          timeout 540s go test ./models/bevelgear -run "^${GATE_TEST}$" -count=1 -timeout 530s -v
  bevel-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check source-default bevel pair
        run: go test ./models/bevelgear -run '^TestSourceDefaultSpiralPair$' -timeout 15m
  bevel-straight-pair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestSourceSixteenTwelveStraightPair
            timeout: 15m
          - test: TestSourceSixteenTwelveStraightPairAutoBore
            timeout: 18m
          - test: TestSourceFourFourStraightPairAutoBore
            timeout: 18m
    name: bevel-straight-pair (${{ matrix.test }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check straight bevel pair
        run: go test ./models/bevelgear -run '^${{ matrix.test }}$' -timeout ${{ matrix.timeout }}
  helical-assembly:
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestSmallHelicalToothAndRootDiscVerifyIndividually
            timeout: 2m
          - test: TestSmallRealHelicalGear
            timeout: 2m
          - test: TestSmallRealHelicalGearThroughBore
            timeout: 2m
          - test: TestSmallRealHelicalGearWithCapChamfer
            timeout: 10m
          - test: TestSmallRealHelicalGearWithBoreAndCapChamfer
            timeout: 10m
          - test: TestDefaultRealHelicalGear
            timeout: 5m
          - test: TestDefaultRealHelicalGearThroughBore
            timeout: 5m
          - test: TestDefaultRealHelicalGearWithBoreAndCapChamfer
            timeout: 10m
    name: helical-assembly (${{ matrix.test }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check real helical assembly
        run: go test ./models/helicalgear -run '^${{ matrix.test }}$' -timeout ${{ matrix.timeout }}
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check model rendering
        run: go -C tools/render test -skip '^Test(BevelGearHero|HelicalGearHero|HerringboneGearHero)$' ./...
  herringbone-cap-chamfer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestSmallRealHerringboneGearWithBoreAndCapChamfer
            timeout: 3m
          - test: TestDefaultRealHerringboneGearWithBoreAndCapChamfer
            timeout: 10m
    name: herringbone-cap-chamfer (${{ matrix.test }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check real herringbone cap chamfers
        run: go test ./models/herringbonegear -run '^${{ matrix.test }}$' -timeout ${{ matrix.timeout }}
  bevel-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check real bevel rendering
        run: go -C tools/render test -run '^TestBevelGearHero$' -timeout 15m ./...
  helical-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check real helical rendering
        run: go -C tools/render test -run '^TestHelicalGearHero$' -timeout 10m ./...
  herringbone-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check real herringbone rendering
        run: go -C tools/render test -run '^TestHerringboneGearHero$' -timeout 10m ./...
