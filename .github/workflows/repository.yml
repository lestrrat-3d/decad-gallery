name: Repository structure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Choose the normal suite or the capped first curved Union diagnostic
        required: true
        default: full_suite
        type: choice
        options:
          - full_suite
          - first_union_driving

jobs:
  structure:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository layout
        run: python3 scripts/check_repository.py
  models:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check model geometry
        run: |
          bevel_skip='^Test(RealEightToothFullPatternJoin|JoinedEightToothPairThroughBore|SourceDefaultSpiral(FirstToothJoin|FullCombine|Pair)|SourceFourFourStraight(Member|Pair)(AutoBore)?|SourceSixteenTwelveStraightPair(AutoBore)?)$'
          helical_skip='^Test(SmallHelicalToothAndRootDiscVerifyIndividually|SmallRealHelicalGear(ThroughBore|WithCapChamfer|WithBoreAndCapChamfer)?|DefaultRealHelicalGear(ThroughBore|WithBoreAndCapChamfer)?)$'
          herringbone_skip='^Test(Small|Default)RealHerringboneGearWithBoreAndCapChamfer$'
          go test -skip "$bevel_skip|$helical_skip|$herringbone_skip" ./...
  bevel-assembly:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestRealEightToothFullPatternJoin
            timeout: 5m
          - test: TestJoinedEightToothPairThroughBore
            timeout: 10m
          - test: TestSourceDefaultSpiralFirstToothJoin/driving
            timeout: 5m
          - test: TestSourceDefaultSpiralFirstToothJoin/pinion
            timeout: 5m
          - test: TestSourceDefaultSpiralFullCombine/driving
            timeout: 10m
          - test: TestSourceDefaultSpiralFullCombine/pinion
            timeout: 10m
          - test: TestSourceFourFourStraightMember
            timeout: 5m
          - test: TestSourceFourFourStraightMemberAutoBore
            timeout: 5m
    name: bevel-assembly (${{ matrix.test }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check real bevel assembly
        run: go test ./models/bevelgear -run '^${{ matrix.test }}$' -timeout ${{ matrix.timeout }}
  bevel-pair:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check source-default bevel pair
        run: go test ./models/bevelgear -run '^TestSourceDefaultSpiralPair$' -timeout 15m
  bevel-straight-pair:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestSourceSixteenTwelveStraightPair
            timeout: 15m
          - test: TestSourceSixteenTwelveStraightPairAutoBore
            timeout: 18m
          - test: TestSourceFourFourStraightPairAutoBore
            timeout: 18m
    name: bevel-straight-pair (${{ matrix.test }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check straight bevel pair
        run: go test ./models/bevelgear -run '^${{ matrix.test }}$' -timeout ${{ matrix.timeout }}
  helical-assembly:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestSmallHelicalToothAndRootDiscVerifyIndividually
            timeout: 2m
          - test: TestSmallRealHelicalGear
            timeout: 2m
          - test: TestSmallRealHelicalGearThroughBore
            timeout: 2m
          - test: TestSmallRealHelicalGearWithCapChamfer
            timeout: 10m
          - test: TestSmallRealHelicalGearWithBoreAndCapChamfer
            timeout: 10m
          - test: TestDefaultRealHelicalGear
            timeout: 5m
          - test: TestDefaultRealHelicalGearThroughBore
            timeout: 5m
          - test: TestDefaultRealHelicalGearWithBoreAndCapChamfer
            timeout: 10m
    name: helical-assembly (${{ matrix.test }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check real helical assembly
        run: go test ./models/helicalgear -run '^${{ matrix.test }}$' -timeout ${{ matrix.timeout }}
  render:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check model rendering
        run: go -C tools/render test -skip '^Test(BevelGearHero|HelicalGearHero|HerringboneGearHero)$' ./...
  herringbone-cap-chamfer:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestSmallRealHerringboneGearWithBoreAndCapChamfer
            timeout: 3m
          - test: TestDefaultRealHerringboneGearWithBoreAndCapChamfer
            timeout: 10m
    name: herringbone-cap-chamfer (${{ matrix.test }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check real herringbone cap chamfers
        run: go test ./models/herringbonegear -run '^${{ matrix.test }}$' -timeout ${{ matrix.timeout }}
  bevel-render:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check real bevel rendering
        run: go -C tools/render test -run '^TestBevelGearHero$' -timeout 15m ./...
  helical-render:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check real helical rendering
        run: go -C tools/render test -run '^TestHelicalGearHero$' -timeout 10m ./...
  herringbone-render:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
      - name: Check real herringbone rendering
        run: go -C tools/render test -run '^TestHerringboneGearHero$' -timeout 10m ./...
  bevel-first-union-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'first_union_driving'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: golang:1.26.8-bookworm
      options: --memory=4g --memory-swap=4g
    env:
      DECAD_SHA: pending
    steps:
      - uses: actions/checkout@v4
      - name: Install process time reporter
        run: apt-get update && apt-get install -y --no-install-recommends time
      - name: Check candidate and run first curved Union
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /sys/fs/cgroup/memory.max ]]; then
            memory_limit=$(cat /sys/fs/cgroup/memory.max)
            swap_limit=$(cat /sys/fs/cgroup/memory.swap.max)
            memory_peak=/sys/fs/cgroup/memory.peak
            test "$swap_limit" = 0
          else
            memory_limit=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)
            swap_limit=$(cat /sys/fs/cgroup/memory/memory.memsw.limit_in_bytes)
            memory_peak=/sys/fs/cgroup/memory/memory.max_usage_in_bytes
            test "$swap_limit" = 4294967296
          fi
          test "$memory_limit" = 4294967296
          trap 'printf "cgroup peak bytes: "; cat "$memory_peak"' EXIT
          [[ "$DECAD_SHA" =~ ^[[:xdigit:]]{40}$ ]]
          pinned=$(go list -m -f '{{.Version}}' github.com/lestrrat-3d/decad)
          candidate=$(go list -m -f '{{.Version}}' "github.com/lestrrat-3d/decad@$DECAD_SHA")
          test "$pinned" = "$candidate"
          printf 'Decad candidate: %s (%s)\n' "$DECAD_SHA" "$pinned"
          /usr/bin/time -v timeout 870s go test ./models/bevelgear \
            -run '^TestSourceDefaultSpiralFirstToothJoin/driving$' -count=1 -timeout 860s
