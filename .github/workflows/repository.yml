name: Repository structure

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: repository-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - id: plan
        env:
          CI_BROAD_OVERRIDE: ${{ vars.CI_BROAD_OVERRIDE }}
        run: python3 scripts/ci/plan.py
      - id: matrix
        env:
          PLAN_JSON: ${{ steps.plan.outputs.plan }}
        run: python3 scripts/ci/gate.py matrix

  worker:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: worker-${{ matrix.suite }}-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'renderer-all' && 180 || 75 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Run selected suite
        env:
          SUITE: ${{ matrix.suite }}
          CASE: ${{ matrix.case }}
        run: python3 scripts/ci/gate.py run

  repository:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check repository layout
        run: python3 scripts/check_repository.py
      - name: Check clamp arm capacity documentation
        if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.plan).changed_paths, 'models/clamparm/instructions.md')
        run: go test ./internal/clamparmcapacity
      - name: Check dependency updater rollback
        run: python3 -m unittest discover -s scripts -p 'test_update_decad.py'
      - name: Check CI test runner
        run: python3 -m unittest discover -s scripts/ci -p 'test_run_tests.py'
      - name: Check CI planner and gate
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check isolated test files
        env:
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: python3 scripts/ci/check_isolated_tests.py
      - name: Check spur generation record
        run: python3 scripts/modelgen/spurgear.py check
      - name: Check workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Check gallery tile cache
        if: needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).suites[0] != null && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
        run: go -C tools/render test -run '^TestGalleryCache' -timeout 5m ./...
      - name: Check mesh geometry helpers
        if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full')
        run: go test ./internal/meshgap ./internal/gearroot ./internal/edgefinish ./internal/m2fastener ./internal/cornercheck ./internal/splitcheck -timeout 5m
      - name: Check model regressions
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full')
        run: python3 scripts/ci/run_tests.py models pr
      - name: Check full model suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')
        env:
          HANDCRANKFAN_FULL: '1'
          PLANETARY_ALL_KITS: '1'
          CI_TEST_RECORDS: repository.jsonl
        run: python3 scripts/ci/full_partition.py
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-repository
          path: repository.jsonl
          if-no-files-found: error
          overwrite: true

  renderer-full:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check full renderer suite
        env:
          CI_TEST_RECORDS: renderer-full.jsonl
        run: python3 scripts/ci/gate.py renderer-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-records-renderer-full
          path: renderer-full.jsonl
          if-no-files-found: error
          overwrite: true

  planetary-motion:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check planetary gearbox motion
        run: go -C tools/render test -run '^TestPlanetaryGearboxMotion$' -timeout 10m ./...

  wheel-motion:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check spinning wheel motion
        run: go -C tools/render test -run '^TestSpinningWheelMotion$' -timeout 30m ./...

  wheel-parts:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check spinning wheel parts table
        run: go -C tools/render test -run '^TestSpinningWheelPartsTable$' -timeout 40m ./...

  fan-motion:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check hand-crank fan motion
        run: go -C tools/render test -run '^TestHandCrankFanMotion$' -timeout 20m ./...

  escapement:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check Graham escapement
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && 'escapement.jsonl' || '' }}
        run: python3 scripts/ci/run_tests.py escapement all
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-escapement
          path: escapement.jsonl
          if-no-files-found: error
          overwrite: true

  onewayclutch:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check one-way clutch
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && 'onewayclutch.jsonl' || '' }}
        run: python3 scripts/ci/run_tests.py onewayclutch all
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-onewayclutch
          path: onewayclutch.jsonl
          if-no-files-found: error
          overwrite: true

  clamparm:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check clamp arm
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && 'clamparm.jsonl' || '' }}
        run: python3 scripts/ci/run_tests.py clamparm all
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-clamparm
          path: clamparm.jsonl
          if-no-files-found: error
          overwrite: true

  turbinefan:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check turbine fan
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && 'turbinefan.jsonl' || '' }}
        run: python3 scripts/ci/run_tests.py turbinefan all
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-turbinefan
          path: turbinefan.jsonl
          if-no-files-found: error
          overwrite: true

  escapement-exploded:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'renderer-all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/render/go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check escapement exploded view
        run: go -C tools/render test -run '^TestEscapementExploded$' -timeout 15m ./...

  wheel:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    strategy:
      fail-fast: false
      matrix:
        case:
          - default-verify
          - default-linkage
          - native
          - small-seven-verify
          - small-seven-linkage
          - large-nine-verify
          - large-nine-linkage
          - twelve
          - small-seventeen
          - rest
    name: wheel-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check spinning wheel
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && format('wheel-{0}.jsonl', matrix.case) || '' }}
          CI_TEST_CASE: ${{ matrix.case }}
        run: python3 scripts/ci/run_tests.py wheel ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-wheel-${{ matrix.case }}
          path: wheel-${{ matrix.case }}.jsonl
          if-no-files-found: error
          overwrite: true

  siren:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad')
    strategy:
      fail-fast: false
      matrix:
        case:
          - default
          - spike
          - slots12
          - slots24
          - rest
    name: siren-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check hand-crank siren
        env:
          CI_TEST_RECORDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full')) && format('siren-{0}.jsonl', matrix.case) || '' }}
          CI_TEST_CASE: ${{ matrix.case }}
        run: python3 scripts/ci/run_tests.py siren ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
        with:
          name: ci-records-siren-${{ matrix.case }}
          path: siren-${{ matrix.case }}.jsonl
          if-no-files-found: error
          overwrite: true

  bevel-pr:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'pull_request' || github.event_name == 'push') && !contains(fromJSON(needs.plan.outputs.plan).suites, 'full')
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: abgh
          - group: cdef
          - group: rest-0
          - group: rest-1
          - group: rest-2
          - group: rest-3
    name: bevel-${{ matrix.group }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check representative bevel geometry shards
        run: python3 scripts/ci/run_tests.py bevel pr ${{ matrix.group }}

  bevel-full:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
          - shard: b
          - shard: c
          - shard: d
          - shard: e
          - shard: f
          - shard: g
          - shard: h
    name: bevel-${{ matrix.shard }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Check full bevel coverage shard
        env:
          CI_TEST_RECORDS: bevel-full-${{ matrix.shard }}.jsonl
          CI_TEST_CASE: ${{ matrix.shard }}
        run: python3 scripts/ci/run_tests.py bevel full ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-records-bevel-full-${{ matrix.shard }}
          path: bevel-full-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          overwrite: true

  planetary-full:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).suites, 'broad') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    strategy:
      fail-fast: false
      matrix:
        case: [kits, rest]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check planetary gearbox
        env:
          CI_TEST_RECORDS: planetary-full-${{ matrix.case }}.jsonl
          CI_TEST_CASE: ${{ matrix.case }}
        run: python3 scripts/ci/run_tests.py planetary full ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-records-planetary-full-${{ matrix.case }}
          path: planetary-full-${{ matrix.case }}.jsonl
          if-no-files-found: error
          overwrite: true

  records-validation:
    needs: [plan, repository, renderer-full, escapement, onewayclutch, clamparm, turbinefan, wheel, siren, bevel-full, planetary-full]
    if: always() && needs.plan.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.plan.outputs.plan).suites, 'full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/render/go.sum
      - name: Discover full test inventory
        run: python3 scripts/ci/inventory.py > inventory.json
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-records-*
          path: ci-artifacts
      - name: Validate full execution records
        run: python3 scripts/ci/reconcile_records.py --execution-dir ci-artifacts --inventory inventory.json --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" > validation-summary.json
      - name: Retain inventory and validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-summary
          path: |
            inventory.json
            validation-summary.json
          if-no-files-found: warn
          overwrite: true
      - name: Check producer results
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os, sys; results = json.loads(os.environ["NEEDS_JSON"]); failed = [name for name, job in results.items() if job["result"] != "success"]; print("Unsuccessful producers:", ", ".join(failed)); sys.exit(bool(failed))'

  gate:
    if: always()
    needs: [plan, worker, repository, renderer-full, planetary-motion, wheel-motion, wheel-parts, fan-motion, escapement,
            onewayclutch, clamparm, turbinefan, escapement-exploded, wheel, siren, bevel-pr, bevel-full,
            records-validation, planetary-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check planned results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/gate.py

  model-checks:
    if: always()
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check aggregate result
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: test "$GATE_RESULT" = success
