name: CI selector probe

on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      empty: ${{ steps.plan.outputs.empty }}
      selected: ${{ steps.plan.outputs.selected }}
      empty_matrix: ${{ steps.plan.outputs.empty_matrix }}
      selected_matrix: ${{ steps.plan.outputs.selected_matrix }}
      empty_count: ${{ steps.plan.outputs.empty_count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PROBE_MODE: plan
        run: python3 scripts/ci/probe.py

  empty-worker:
    needs: plan
    if: needs.plan.outputs.empty_count != '0'
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.empty_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  selected-worker:
    needs: plan
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.selected_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Mock selected dispatch
        env:
          SUITE: ${{ matrix.suite }}
          CASE: ${{ matrix.case }}
        run: test "$SUITE" = wheel-parts && test "$CASE" = 0

  failed-worker:
    needs: plan
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.selected_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Simulate dispatch failure
        run: exit 1

  verify:
    if: always()
    needs: [plan, empty-worker, selected-worker, failed-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify gate decisions
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EMPTY_PLAN: ${{ needs.plan.outputs.empty }}
          SELECTED_PLAN: ${{ needs.plan.outputs.selected }}
        run: python3 scripts/ci/probe.py
