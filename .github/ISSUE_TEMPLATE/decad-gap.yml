name: Decad gap or bug
description: Record a decad feature or bug that blocks a gallery model.
title: "Decad gap: "
labels: [decad-gap]
body:
  - type: input
    id: item
    attributes:
      label: Affected gallery item
      placeholder: models/example
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Needed behavior
      description: Describe the geometry or operation the model needs.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Current behavior
      description: Describe the missing API or the result from decad.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Local reproduction
      description: Provide the smallest local input and the command to run it.
    validations:
      required: true
